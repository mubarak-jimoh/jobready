<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Login - JobReady</title>

  <link
    rel="stylesheet"
    href="../style.css"
  />

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
</head>

<body>

  <div class="auth-container">

    <div class="auth-card">

      <div class="logo auth-logo">
        JobReady
      </div>

      <h1>
        Welcome back
      </h1>

      <p>
        Log in to continue building your interview-ready CV.
      </p>

      <button
        type="button"
        class="google-auth-btn"
        id="googleLoginBtn"
      >
        Continue with Google
      </button>

      <div class="auth-divider">
        <span>or</span>
      </div>

      <form id="loginForm">

        <input
          id="loginEmail"
          type="email"
          placeholder="Email Address"
          required
        />

        <input
          id="loginPassword"
          type="password"
          placeholder="Password"
          required
        />

        <button type="submit">
          Login
        </button>

      </form>

      <div class="auth-switch">
        Don’t have an account?

        <a href="signup.html">
          Create account
        </a>
      </div>

    </div>

  </div>

  <script
    type="module"
    src="../js/auth.js"
  ></script>

</body>

</html>

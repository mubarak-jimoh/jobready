<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    Create Account - JobReady
  </title>

  <link
    rel="stylesheet"
    href="../style.css"
  />

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

</head>

<body>

  <div class="auth-container">

    <div class="auth-card">

      <div class="logo auth-logo">
        JobReady
      </div>

      <h1>
        Create your account
      </h1>

      <p>
        Start building recruiter-ready CVs with AI.
      </p>

      <button
        type="button"
        class="google-auth-btn"
        id="googleSignupBtn"
      >
        Continue with Google
      </button>

      <div class="auth-divider">
        <span>or</span>
      </div>

      <form id="signupForm">

        <input
          id="signupEmail"
          type="email"
          placeholder="Email Address"
          required
        />

        <input
          id="signupPassword"
          type="password"
          placeholder="Password"
          required
        />

        <button type="submit">

          Create Account

        </button>

      </form>

      <div class="auth-switch">

        Already have an account?

        <a href="login.html">
          Login
        </a>

      </div>

    </div>

  </div>

  <script
    type="module"
    src="../js/auth.js"
  ></script>

</body>

</html>
